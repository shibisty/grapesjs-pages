openapi: 3.0.3
info:
  title: grapesjs-pages sync API
  version: 1.0.0
  description: |
    The REST contract the `grapesjs-pages` plugin uses for manual sync
    (`RestClient` in `src/sync/RestClient.ts`). The base URL is what the user
    enters in the plugin's server settings (e.g. `https://example.com/api/v1`).

    Concurrency is optimistic: every page has an opaque `version` that the
    server changes on every write. The client sends the version it based its
    edits on in `If-Match` (quoted, like an ETag); the server answers
    `412 Precondition Failed` when it no longer matches. Without `If-Match`
    the write is unconditional (the user chose "keep mine").

    Page ids are generated by the client (UUID) and are stable across
    devices; `PUT` creates a page that does not exist yet.
servers:
  - url: https://example.com/api/v1
security:
  - {}
  - bearer: []
paths:
  /pages:
    get:
      summary: List pages (metadata only)
      responses:
        '200':
          description: >
            Either a bare array or an object with `items` — the client accepts both.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Error' }
  /pages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a page with its project data
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Create or replace a page
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Quoted version the client's edits are based on, e.g. `"7"`. Omitted = unconditional write.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageWrite' }
      responses:
        '200':
          description: Updated; returns the new metadata (new `version`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageMeta' }
        '201':
          description: Created; returns the metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageMeta' }
        '412':
          description: >
            `If-Match` does not match the current version (or the page no longer
            exists). `409` is treated the same way by the client.
    delete:
      summary: Delete a page
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404': { description: Already gone — the client treats it as success. }
        '412': { description: Changed on the server since the client saw it. }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Optional token from the plugin settings. Extra headers can be added with the `headers` plugin option.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    PageMeta:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string }
        name: { type: string }
        version:
          description: Opaque; compared as a string. Must change on every write.
          oneOf: [{ type: string }, { type: integer }]
        updatedAt:
          description: Server time of the last write (ms or ISO string). Informational.
          oneOf: [{ type: number }, { type: string }]
    Page:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/ProjectData' }
    PageWrite:
      type: object
      required: [id, name, data]
      properties:
        id: { type: string }
        name: { type: string }
        data: { $ref: '#/components/schemas/ProjectData' }
        updatedAt:
          type: number
          description: Client time of the last local edit (ms). Informational.
    ProjectData:
      type: object
      description: >
        GrapesJS project JSON (`editor.getProjectData()`): `assets`, `styles`,
        `pages`, `symbols`, `dataSources`… Store it as an opaque document.
      additionalProperties: true

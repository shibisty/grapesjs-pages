<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>grapesjs-pages — dev</title>
    <link rel="stylesheet" href="/node_modules/grapesjs/dist/css/grapes.min.css" />
    <style>html, body { margin: 0; height: 100%; }</style>
  </head>
  <body>
    <div id="gjs"></div>
    <script type="module">
      import grapesjs from 'grapesjs';
      import pages from './src/index.ts';

      window.editor = grapesjs.init({
        container: '#gjs',
        height: '100vh',
        storageManager: false,
        components: '<h1 id="title">Hello pages</h1><p class="lead">Edit me, then add a page.</p>',
        style: '#title{color:#c00}.lead{font-size:20px}',
        plugins: [pages],
        pluginsOpts: { [pages]: {} },
      });
    </script>
  </body>
</html>
